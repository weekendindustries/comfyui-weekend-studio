# Publishes the node pack to the Comfy Registry (registry.comfy.org) — Comfy's own action, as their
# publishing guide sets it up. Runs when a push to main changes pyproject.toml (bump `version`, and
# `VERSION` in weekend_studio/routes.py with it), or by hand from the Actions tab.
# Needs the repository secret REGISTRY_ACCESS_TOKEN: an API key from the publisher's page.
name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'weekendindustries' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
