# Publishes the node pack to the Comfy Registry (registry.comfy.org) — Comfy's own action, as their
# publishing guide sets it up. Runs when a push to main changes pyproject.toml (bump `version`, and
# `VERSION` in weekend_studio/routes.py with it), or by hand from the Actions tab.
# Needs the repository secret REGISTRY_ACCESS_TOKEN: an API key from the publisher's page.
name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'weekendindustries' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        # Pinned to a commit (0.2.2): this step holds the Registry token, so a moving @main would run
        # whatever lands there next. d2366e7 = main as of 2025-05-10, the version 0.2.0 published with.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
